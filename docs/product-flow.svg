<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">CS-Switch conceptual product workflow</title>
  <desc id="desc">Choose a compatible model, connect and test it in CS-Switch, then use the original Claude Science tools and task interface. This is an illustration, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d38"/><stop offset="1" stop-color="#071b26"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#6ce6cc"/><stop offset="1" stop-color="#7bc9fa"/></linearGradient>
    <filter id="shadow" x="-.15" y="-.2" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#70d5da"/></marker>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1340" cy="-20" r="240" fill="#5dbac2" opacity=".045"/>
  <circle cx="1410" cy="35" r="300" fill="none" stroke="#92e1d5" stroke-opacity=".06"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="70" fill="#84decf" font-size="18" font-weight="650" letter-spacing="3">CS-SWITCH</text>
    <text x="72" y="124" fill="#f2fbfc" font-size="40" font-weight="650">Your model. Your scientific workflow.</text>
    <text x="72" y="161" fill="#abc6d0" font-size="19">An independent local workbench for a connected research experience</text>
    <path d="M454 316H498" fill="none" stroke="#70d5da" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M930 316H974" fill="none" stroke="#70d5da" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="72" y="215" width="370" height="220" rx="20" fill="#163944" stroke="#315661"/>
      <rect x="516" y="215" width="402" height="220" rx="20" fill="#173d46" stroke="#65d5c1" stroke-opacity=".7"/>
      <rect x="992" y="215" width="376" height="220" rx="20" fill="#153640" stroke="#315661"/>
    </g>
    <g stroke="#90dfd1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="100" y="244" width="44" height="34" rx="8"/>
      <path d="M108 255h27m-27 11h18"/>
      <path d="M550 249h36m-9-7 9 7-9 7m9 19h-36m9-7-9 7 9 7"/>
      <rect x="1020" y="244" width="46" height="34" rx="6"/>
      <path d="M1020 254h46m-31 31h17m-8-7v7"/>
    </g>
    <g fill="#f2fbfc" font-size="27" font-weight="650">
      <text x="100" y="321">Choose a model</text>
      <text x="544" y="321">Connect &amp; test</text>
      <text x="1020" y="321">Keep working</text>
    </g>
    <g fill="#b1ccd4" font-size="18">
      <text x="100" y="360">Compatible providers</text>
      <text x="100" y="389">or a suitable local model</text>
      <text x="544" y="360">CS-Switch workbench</text>
      <text x="544" y="389">One active, tested connection</text>
      <text x="1020" y="360">Original Claude Science</text>
      <text x="1020" y="389">Tools, files and tasks</text>
    </g>
    <path d="M72 475H1368" stroke="#39606b" stroke-opacity=".65"/>
    <text x="72" y="514" fill="#9abcc6" font-size="17">Conceptual workflow</text>
    <text x="1368" y="514" fill="#9abcc6" font-size="17" text-anchor="end">Bring your own original installation · Existing sandbox and approvals remain</text>
  </g>
</svg>
