name: Focused CS-Switch checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:version
      - if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version.mjs --base "$PR_BASE_SHA"
      - name: Changed modules and direct contracts only
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/test-scope.mjs "$TEST_BASE_SHA"
